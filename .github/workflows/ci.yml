name: reviewer artifact verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install exact polyhedral tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libcdd-tools
      - name: Install verification dependencies
        run: uv sync --frozen --extra experiments --extra validation --extra dev
      - name: Verify tests, evidence hashes, and scientific gates
        run: make verify PYTHON=.venv/bin/python
